name: Unzip Just2Profit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip ZIP
        run: |
          mkdir -p extracted
          unzip -o Just2Profit-Fixed.zip -d extracted

      - name: Move files
        run: |
          cp -r extracted/Just2Profit-Fixed/* .
          rm -rf extracted
          rm -f Just2Profit-Fixed.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Just2Profit project" || echo "Nothing to commit"
          git push
